name: Cask

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Register checkout as a tap
        run: |
          tap_dir="$(brew --repository)/Library/Taps/isimstore/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"
          brew trust --cask isimstore/tap/simstore
      - name: Check style
        run: brew style --cask isimstore/tap/simstore
      - name: Audit cask
        run: brew audit --cask --online isimstore/tap/simstore
      - name: Test installation and uninstallation
        run: |
          brew install --cask isimstore/tap/simstore
          test -x "$HOME/Applications/SimStore.app/Contents/MacOS/SimStore"
          test ! -e /Applications/SimStore.app
          xattr -r "$HOME/Applications/SimStore.app" > "$RUNNER_TEMP/simstore-xattrs.txt"
          if grep -q 'com.apple.quarantine' "$RUNNER_TEMP/simstore-xattrs.txt"; then
            echo "::error::SimStore still has quarantine attributes after installation"
            exit 1
          fi
          brew uninstall --cask isimstore/tap/simstore
          test ! -e "$HOME/Applications/SimStore.app"
